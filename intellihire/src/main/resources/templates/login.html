<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
        }

        .login-card{
            border-radius:20px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card login-card shadow-lg p-5 bg-dark text-light">

                <h1 class="text-center text-info mb-4">
                    IntelliHire Login
                </h1>

                <form action="/loginUser" method="post">

                    <div class="mb-4">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter Email">

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter Password">

                    </div>

                    <button class="btn btn-info w-100 text-white">
                        Login
                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="/forgotPassword"
                       class="text-warning text-decoration-none">
                        Forgot Password?
                    </a>

                </div>

                <div class="text-center mt-4">

                    <a href="/"
                       class="text-info">
                        Create New Account
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
