<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <a href="/dashboard"
               class="btn btn-primary">
                Home
            </a>

            <h2 class="text-success m-0">
                Job Applications
            </h2>

            <div></div>

        </div>

        <table class="table table-dark table-bordered table-hover">

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Job</th>
                <th>Company</th>
                <th>Resume</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="a : ${applications}">

                <td th:text="${a.id}"></td>

                <td th:text="${a.userName}"></td>

                <td th:text="${a.userEmail}"></td>

                <td th:text="${a.jobTitle}"></td>

                <td th:text="${a.company}"></td>

                <td>

                    <a th:href="@{'/uploads/' + ${a.resume}}"
                       target="_blank"
                       class="btn btn-primary btn-sm">
                        View Resume
                    </a>

                </td>

                <td th:text="${a.status}"></td>

                <td>

                    <a th:href="@{/updateStatus(id=${a.id},status='SHORTLISTED')}"
                       class="btn btn-success btn-sm">
                        Shortlist
                    </a>

                    <a th:href="@{/updateStatus(id=${a.id},status='REJECTED')}"
                       class="btn btn-danger btn-sm">
                        Reject
                    </a>

                    <a th:href="@{/updateStatus(id=${a.id},status='SELECTED')}"
                       class="btn btn-info btn-sm">
                        Select
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
