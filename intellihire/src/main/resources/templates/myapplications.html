<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        html,
        body{
            background:#0f172a;
            min-height:100vh;
        }

        .card{
            background:#212529;
            color:white;
            border:none;
        }

    </style>

</head>

<body class="text-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <a href="/dashboard"
               class="btn btn-primary">
                Home
            </a>

            <h2 class="text-success m-0">
                My Applications
            </h2>

            <div></div>

        </div>

        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show shadow-lg text-center">

            <h5 class="mb-1">
                🎉 Application Submitted Successfully!
            </h5>

            <p class="mb-0">
                Your application has been sent to the recruiter.
            </p>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>

        <table class="table table-dark table-bordered table-hover">

            <thead>

            <tr>

                <th>ID</th>
                <th>Job Title</th>
                <th>Company</th>
                <th>Status</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="a : ${applications}">

                <td th:text="${a.id}"></td>

                <td th:text="${a.jobTitle}"></td>

                <td th:text="${a.company}"></td>

                <td th:text="${a.status}"></td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    setTimeout(function () {
        let alertBox = document.querySelector('.alert');
        if(alertBox){
            alertBox.style.display = 'none';
        }
    }, 3000);
</script>

</body>

</html>
