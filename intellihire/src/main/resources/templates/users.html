<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>All Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
        }

        .main-card{
            border-radius:20px;
        }

        .table{
            border-radius:15px;
            overflow:hidden;
        }

        .search-box{
            border-radius:12px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="card main-card shadow-lg p-4 bg-dark text-light">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="text-info">
                Registered Users
            </h2>

            <a href="/dashboard"
               class="btn btn-primary">
                Home
            </a>

        </div>

        <form action="/search" method="get" class="mb-4">

            <div class="row g-2">

                <div class="col-md-10">

                    <input
                            type="text"
                            name="name"
                            class="form-control search-box"
                            placeholder="Search User By Name">

                </div>

                <div class="col-md-2">

                    <button class="btn btn-info w-100 text-white">
                        Search
                    </button>

                </div>

            </div>

        </form>

        <table class="table table-dark table-hover table-bordered align-middle">

            <thead class="table-primary text-dark">

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Resume</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="u : ${users}">

                <td th:text="${u.id}"></td>

                <td th:text="${u.name}"></td>

                <td th:text="${u.email}"></td>

                <td>

                    <span th:if="${u.resume != null}"
                          th:text="${u.resume}">
                    </span>

                    <span th:if="${u.resume == null}">
                        No Resume
                    </span>

                </td>

                <td>

                    <a th:href="@{/edit(id=${u.id})}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a th:href="@{/delete(id=${u.id})}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="d-flex justify-content-center mt-4">

            <a
                    th:if="${currentPage > 0}"
                    th:href="@{/users(page=${currentPage-1})}"
                    class="btn btn-info me-2 text-white">

                Previous

            </a>

            <a
                    th:if="${currentPage+1 < totalPages}"
                    th:href="@{/users(page=${currentPage+1})}"
                    class="btn btn-info text-white">

                Next

            </a>

        </div>

    </div>

</div>

</body>
</html>
