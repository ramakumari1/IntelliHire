<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#0f172a;
        }

        .card-box{
            border-radius:20px;
            transition:0.3s;
        }

        .card-box:hover{
            transform:translateY(-5px);
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            IntelliHire Dashboard
        </span>

        <a href="/logout"
           class="btn btn-danger">
            Logout
        </a>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="text-center text-light mb-5">

        Welcome,
        <span th:text="${session.loggedUser.name}"></span>

    </h2>
    <div class="text-center mb-4">

    <span th:if="${session.loggedUser.role == 'USER'}"
          class="badge bg-success fs-6">
        USER
    </span>

        <span th:if="${session.loggedUser.role == 'ADMIN'}"
              class="badge bg-danger fs-6">
        ADMIN
    </span>

    </div>

    <div class="row g-4">

        <!-- ADMIN DASHBOARD -->

        <div th:if="${session.loggedUser.role == 'ADMIN'}"
             class="col-md-4">

            <div class="card card-box bg-primary text-white p-4">

                <h4>Total Users</h4>

                <h1 th:text="${totalUsers}"></h1>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'ADMIN'}"
             class="col-md-4">

            <div class="card card-box bg-success text-white p-4">

                <h4>Total Jobs</h4>

                <h1 th:text="${totalJobs}"></h1>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'ADMIN'}"
             class="col-md-4">

            <div class="card card-box bg-warning text-dark p-4">

                <h4>Total Applications</h4>

                <h1 th:text="${totalApplications}"></h1>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'ADMIN'}"
             class="col-md-4">

            <div class="card card-box bg-secondary text-white text-center p-4">
                <i class="bi bi-people-fill fs-1"></i>

                <h5>Manage Users</h5>

                <a href="/users"
                   class="btn btn-light mt-3">
                    Open
                </a>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'ADMIN'}"
             class="col-md-4">

            <div class="card card-box bg-success text-white text-center p-4">
                <i class="bi bi-briefcase-fill fs-1"></i>

                <h5>Manage Jobs</h5>

                <a href="/jobs"
                   class="btn btn-light mt-3">
                    Open
                </a>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'ADMIN'}"
             class="col-md-4">

            <div class="card card-box bg-danger text-white text-center p-4">
                <i class="bi bi-shield-lock-fill fs-1"></i>

                <h5>Admin Panel</h5>

                <a href="/admin"
                   class="btn btn-light mt-3">
                    Open
                </a>

            </div>

        </div>

        <!-- USER DASHBOARD -->

        <div th:if="${session.loggedUser.role == 'USER'}"
             class="col-md-3">

            <div class="card card-box bg-info text-white text-center p-4">

                <i class="bi bi-person-circle fs-1 text-primary"></i>
                <h5 class="mt-3">My Profile</h5>

                <a href="/profile"
                   class="btn btn-primary mt-3">
                    Open
                </a>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'USER'}"
             class="col-md-3">

            <div class="card card-box bg-success text-white text-center p-4">

                <i class="bi bi-briefcase-fill fs-1 text-success"></i>
                <h5 class="mt-3">Available Jobs</h5>

                <a href="/jobs"
                   class="btn btn-success mt-3">
                    View Jobs
                </a>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'USER'}"
             class="col-md-3">

            <div class="card card-box bg-warning text-dark text-center p-4">

                <i class="bi bi-file-earmark-text-fill fs-1 text-warning"></i>
                <h5 class="mt-3">My Applications</h5>

                <a href="/myApplications"
                   class="btn btn-warning mt-3">
                    View
                </a>

            </div>

        </div>

        <div th:if="${session.loggedUser.role == 'USER'}"
             class="col-md-3">

            <div class="card card-box bg-primary text-white text-center p-4">

                <i class="bi bi-file-earmark-person-fill fs-1 text-info"></i>
                <h5 class="mt-3">Resume</h5>

                <a href="/profile"
                   class="btn btn-info mt-3">
                    Manage
                </a>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
