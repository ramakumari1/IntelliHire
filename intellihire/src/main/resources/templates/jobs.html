<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Available Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <a href="/dashboard"
               class="btn btn-primary">
                Home
            </a>

            <h2 class="text-primary m-0">
                Available Jobs
            </h2>

            <div>

                <a th:if="${session.loggedUser.role == 'ADMIN'}"
                   href="/addJob"
                   class="btn btn-success">
                    Add New Job
                </a>

            </div>

        </div>

        <form action="/searchJob" method="get" class="mb-3">

            <div class="input-group">

                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Search Job Title">

                <button class="btn btn-primary"
                        type="submit">
                    Search
                </button>

            </div>

        </form>

        <table class="table table-dark table-bordered table-hover">

            <thead>

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Company</th>
                <th>Location</th>
                <th>Salary</th>
                <th>Description</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="j : ${jobs}">

                <td th:text="${j.id}"></td>

                <td th:text="${j.title}"></td>

                <td th:text="${j.company}"></td>

                <td th:text="${j.location}"></td>

                <td th:text="${j.salary}"></td>

                <td th:text="${j.description}"></td>

                <td>

                    <a th:href="@{/jobDetails(id=${j.id})}"
                       class="btn btn-info btn-sm mb-1">
                        View
                    </a>

                    <br>

                    <div th:if="${session.loggedUser != null and session.loggedUser.role == 'USER'}">

                        <a th:if="${#lists.contains(applications.![jobTitle], j.title) == false}"
                           th:href="@{/applyJob(id=${j.id})}"
                           class="btn btn-success btn-sm">

                            Apply

                        </a>

                        <button th:if="${#lists.contains(applications.![jobTitle], j.title)}"
                                class="btn btn-warning btn-sm"
                                disabled>

                            Applied

                        </button>

                    </div>

                    <div th:if="${session.loggedUser != null and session.loggedUser.role == 'USER'}">

                        <a th:href="@{/deleteJob(id=${j.id})}"
                           class="btn btn-danger btn-sm">

                            Delete

                        </a>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
